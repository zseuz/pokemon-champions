name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Compilar, linter, tests y datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Compilar (TypeScript + Vite)
        run: npm run build
      - name: Tests
        run: npm test
      - name: Validar sets del meta
        run: npm run validate
